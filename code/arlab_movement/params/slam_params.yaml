slam_toolbox:
  ros__parameters:
    # Basic parameters
    use_pose_graph_slam: true
    mode: "mapping"  # This does both mapping and localization
    
    # Map saving/loading
    map_file_name: "my_slam_map"
    save_map_time_interval: 60.0  # Auto-save every 60 seconds
    
    # Online Sync specific
    online_async_scan_queue_size: 10
    transform_timeout: 0.2
    
    # Loop closure (important for preventing drift)
    loop_closure_search_distance: 10.0
    loop_closure_minimum_chain_size: 3
    loop_closure_max_match_distance: 0.3
    
    # ROS 2 specific
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_link"