# YOLO Dataset Configuration for arlab_computer_vision
# Training Dataset: 2 Classes Example

# Path to the dataset root directory
# Relative to the YAML file (. = training/data/)
path: .

# Paths to training and validation sets
# Defined relative to 'path'
train: train/images
val: validation/images

# Number of classes
nc: 2 # TODO: Adjust number of classes

# Class names (Mapping: ID → Name)
# IMPORTANT: The order here defines the class IDs!
names:
  0: object_1  # First class (ID: 0) - Labels with "0" refer to this
  1: object_2  # Second class (ID: 1) - Labels with "1" refer to this

# Optional: Download information
# download: "https://example.com/dataset.zip"

# Optional: License information
# license: "MIT License"

