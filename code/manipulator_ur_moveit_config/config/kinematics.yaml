ur_manipulator:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin

  # TRAC-IK supports this (seconds). Your current 0.005 is often too small in practice.
  kinematics_solver_timeout: 0.1

  # Optional TRAC-IK parameters:
  solve_type: Distance       # Speed | Distance | Manipulation1 | Manipulation2 | Manipulation3
  epsilon: 1e-5              # Convergence tolerance (small positive number)
  position_only_ik: false    # true = ignore orientation (debugging / special tasks)
