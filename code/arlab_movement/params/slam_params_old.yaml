use_sim_time: true # True if using Gazebo or bag playback

slam_toolbox:
  # Core configuration
  mode: mapping # 'mapping' or 'localization'
  map_file_name: /tmp/slam_toolbox_map
  debug_logging: false

  # Timing and performance
  throttle_scans: 1
  transform_publish_period: 0.02 # 50 Hz
  map_update_interval: 2.0
  resolution: 0.05
  max_laser_range: 12.0
  minimum_time_interval: 0.5
  transform_timeout: 0.2
  tf_buffer_duration: 30.0

  # Motion and scan matching thresholds
  minimum_travel_distance: 0.2
  minimum_travel_heading: 0.174 # radians (~10 deg)

  # Scan matching and loop closure
  use_scan_matching: true
  use_scan_barycenter: true
  scan_buffer_size: 10
  scan_buffer_maximum_scan_distance: 10.0
  link_match_minimum_response_fine: 0.1
  link_scan_maximum_distance: 1.5
  do_loop_closing: true
  loop_search_maximum_distance: 3.0
  loop_search_num_submap: 5
  loop_match_minimum_chain_size: 10
  loop_match_maximum_variance_coarse: 3.0
  loop_match_minimum_response_coarse: 0.35
  loop_match_minimum_response_fine: 0.45

  # Map publishing
  enable_interactive_mode: false
  publish_map_on_update: true
  map_start_at_dock: false
  use_pose_graph_slam: true
  pose_graph_save_period: -1.0 # disable auto-save
  temporal_update: 0.1

  # Frames and topics
  scan_topic: /scan
  base_frame: base_footprint # or 'base_link' depending on your TF tree
  odom_frame: odom
  map_frame: map

  # Sensor and odometry model
  odom_model_type: diff-corrected
  correlation_search_space_dimension: 0.5
  correlation_search_space_resolution: 0.01
  correlation_search_space_smear_deviation: 0.1
  loop_search_space_dimension: 8.0
  loop_search_space_resolution: 0.05
  loop_search_space_smear_deviation: 0.03

  # Laser filtering
  maximum_laser_range: 12.0
  minimum_laser_range: 0.05
  use_map_saver: true
