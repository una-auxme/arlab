camera_cloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/color/points
  max_range: 2.0
  point_subsample: 4
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 10.0
  filtered_cloud_topic: ""
  ns: ""

