# These limits are used by MoveIt and augment/override the definitions in ur_description.
#
# While the robot does not inherently have any limits on joint accelerations (only on torques),
# MoveIt needs them for time parametrization. They were chosen conservatively to work in most use
# cases. For specific applications, higher values might lead to better execution performance.

joint_limits:
  shoulder_pan_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0

  # MIA hand joints. MoveIt's time parameterization needs acceleration limits
  # for every actively planned joint; without these, Plan & Execute aborts
  # before sending the trajectory to ros2_control.
  j_thumb_opp:
    has_position_limits: true
    min_position: -1.0
    max_position: 1.0
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  j_thumb_fle:
    has_position_limits: true
    min_position: 0.0
    max_position: 1.2
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  j_index_fle:
    has_position_limits: true
    min_position: 0.0
    max_position: 1.2
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  j_mrl_fle:
    has_position_limits: true
    min_position: 0.0
    max_position: 1.2
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 2.0
